name: Clear stale Pages deployments

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/clear-stale-pages-deployments.yml

permissions:
  contents: read
  actions: write
  deployments: write
  pages: write

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stuck Pages deployment and clear locks
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const stuckPagesDeployment = '3994159d5deda554348c277c0ff956880017779d';

            try {
              await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', {
                owner,
                repo,
                pages_deployment_id: stuckPagesDeployment
              });
              core.info('Cancelled stuck Pages deployment ' + stuckPagesDeployment);
            } catch (error) {
              core.warning('Pages deployment cancel response: ' + error.message);
            }

            try {
              await github.rest.actions.cancelWorkflowRun({
                owner,
                repo,
                run_id: 31103210222
              });
              core.info('Cancelled queued workflow run 31103210222');
            } catch (error) {
              core.warning('Workflow cancel response: ' + error.message);
            }

            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              { owner, repo, environment: 'github-pages', per_page: 100 }
            );

            let cleared = 0;
            for (const deployment of deployments) {
              const response = await github.rest.repos.listDeploymentStatuses({
                owner, repo, deployment_id: deployment.id, per_page: 1
              });
              const state = response.data[0] && response.data[0].state;
              if (state && state !== 'success' && state !== 'inactive') {
                await github.rest.repos.createDeploymentStatus({
                  owner, repo, deployment_id: deployment.id,
                  state: 'inactive',
                  description: 'Clear stale Pages deployment lock',
                  auto_inactive: false
                });
                cleared += 1;
              }
            }

            core.info('Cleared ' + cleared + ' stale repository deployment(s).');
