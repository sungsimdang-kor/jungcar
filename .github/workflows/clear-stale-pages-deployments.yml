name: Clear stale Pages deployments

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/clear-stale-pages-deployments.yml

permissions:
  contents: read
  deployments: write

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Mark non-final Pages deployments inactive
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              { owner, repo, environment: 'github-pages', per_page: 100 }
            );
            let cleared = 0;
            for (const deployment of deployments) {
              const response = await github.rest.repos.listDeploymentStatuses({
                owner, repo, deployment_id: deployment.id, per_page: 1
              });
              const state = response.data[0] && response.data[0].state;
              if (state && state !== 'success' && state !== 'inactive') {
                await github.rest.repos.createDeploymentStatus({
                  owner, repo, deployment_id: deployment.id,
                  state: 'inactive',
                  description: 'Clear stale Pages deployment lock',
                  auto_inactive: false
                });
                cleared += 1;
              }
            }
            core.info('Cleared ' + cleared + ' stale Pages deployment(s).');
