name: Restore GitHub Pages

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/clear-stale-pages-deployments.yml

permissions:
  contents: read
  actions: write
  deployments: write
  pages: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel queued deployments and recreate Pages site
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const queuedDeployments = [
              '3994159d5deda554348c277c0ff956880017779d',
              '1a1433840ed29852cf7e68296511d9e4a6bfa945',
              context.sha
            ];

            for (const pagesDeploymentId of queuedDeployments) {
              try {
                await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', {
                  owner,
                  repo,
                  pages_deployment_id: pagesDeploymentId
                });
                core.info('Cancelled Pages deployment ' + pagesDeploymentId);
              } catch (error) {
                core.info('No active Pages deployment for ' + pagesDeploymentId + ': ' + error.message);
              }
            }

            try {
              await github.request('DELETE /repos/{owner}/{repo}/pages', { owner, repo });
              core.info('Removed the broken Pages site configuration.');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info('Pages site was already absent.');
            }

            await new Promise(resolve => setTimeout(resolve, 5000));

            await github.request('POST /repos/{owner}/{repo}/pages', {
              owner,
              repo,
              build_type: 'legacy',
              source: { branch: 'main', path: '/' }
            });
            core.info('Recreated GitHub Pages from main / (root).');
