name: Clear stale Pages deployment

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/clear-pages-lock.yml

permissions:
  contents: read
  deployments: write

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Mark stale Pages deployment inactive
        uses: actions/github-script@v7
        with:
          script: |
            const staleSha = 'a3a43d16db51417d49db09feea52ba9cf3ceae5d';
            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              { owner: context.repo.owner, repo: context.repo.repo, sha: staleSha }
            );
            core.info('Found ' + deployments.length + ' deployment(s) for ' + staleSha);
            for (const deployment of deployments) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
                state: 'inactive',
                description: 'Clear stale Pages deployment lock',
                auto_inactive: false
              });
            }
